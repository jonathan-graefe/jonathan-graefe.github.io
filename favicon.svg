<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A loop diagram: two vertices joined by a loop, each with two legs">
	<defs>
		<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1c1b3a"/>
			<stop offset="1" stop-color="#14132b"/>
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="url(#g)"/>
	<g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
		<line x1="15" y1="32" x2="7" y2="20"/>
		<line x1="15" y1="32" x2="7" y2="44"/>
		<line x1="49" y1="32" x2="57" y2="20"/>
		<line x1="49" y1="32" x2="57" y2="44"/>
	</g>
	<ellipse cx="32" cy="32" rx="17" ry="12" fill="none" stroke="#a9b8ea" stroke-width="4.5"/>
	<circle cx="15" cy="32" r="5" fill="#ffffff"/>
